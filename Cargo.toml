[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/hardware-linux",
    "crates/lcd-renderer",
    "crates/daemon",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Lowest toolchain that actually compiles the workspace. 1.89 is the floor the
# dependency graph imposes (`font-types`, via gpui); 1.90 is the lowest version
# verified by a full `cargo check --workspace --all-targets`. The toolchain the
# project builds with is pinned separately in rust-toolchain.toml.
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/arthjean/herschel"

[workspace.dependencies]
herschel-core = { path = "crates/core" }
herschel-hardware-linux = { path = "crates/hardware-linux" }
herschel-lcd-renderer = { path = "crates/lcd-renderer" }

anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.1"
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "net", "process", "system"] }

[workspace.lints.clippy]
# Panic-like escapes: this process owns cooling hardware, so an unwind in a
# command path is a safety problem, not a stack trace.
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "warn"

unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
