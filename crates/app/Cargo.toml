[package]
name = "kori-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native GPUI control surface for allowlisted NZXT hardware"

[[bin]]
name = "kori"
path = "src/main.rs"

[dependencies]
kori-core.workspace = true
kori-lcd-renderer.workspace = true
gpui = "0.2.2"
serde_json.workspace = true
anyhow.workspace = true
futures = "0.3"

[dev-dependencies]
# The picture fixtures: the compiled preview cannot be exercised without a real
# file carrying more than one frame.
kori-lcd-renderer = { workspace = true, features = ["testing"] }
# The headless window every screen is built into. Nothing else exercises an
# element tree: the rules a screen applies are unit-tested, but GPUI only
# asserts on a doubled hover style when the screen holding it is drawn.
gpui = { version = "0.2.2", features = ["test-support"] }

[lints]
workspace = true
