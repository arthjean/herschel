[package]
name = "herschel-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-user daemon owning every write to allowlisted NZXT hardware"

[[bin]]
name = "herscheld"
path = "src/main.rs"

[lib]
name = "herschel_daemon"
path = "src/lib.rs"

[dependencies]
herschel-core.workspace = true
herschel-hardware-linux.workspace = true
herschel-lcd-renderer.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
rustix.workspace = true

[dev-dependencies]
herschel-hardware-linux = { workspace = true, features = ["testing"] }

[lints]
workspace = true
