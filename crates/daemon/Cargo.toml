[package]
name = "kori-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-user daemon owning every write to allowlisted NZXT hardware"

[[bin]]
name = "korid"
path = "src/main.rs"

[lib]
name = "kori_daemon"
path = "src/lib.rs"

[dependencies]
kori-core.workspace = true
kori-hardware-linux.workspace = true
kori-lcd-renderer.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
rustix.workspace = true
# MIT OR Apache-2.0, both compatible with GPL-3.0-or-later. Taken for the one
# thing std cannot do: notice SIGTERM. Without it `korid` is killed mid-write
# under `systemctl stop`, and the orderly shutdown the server already implements
# has nothing to trigger it. Only the `iterator` feature is used, which delivers
# signals to an ordinary thread rather than running anything in a handler.
signal-hook = { workspace = true }

[dev-dependencies]
kori-hardware-linux = { workspace = true, features = ["testing"] }
# The picture fixtures: an animation cannot be exercised without a real file
# carrying more than one frame.
kori-lcd-renderer = { workspace = true, features = ["testing"] }

[lints]
workspace = true
