[package]
name = "herschel-lcd-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Turns one DisplayPreset into the exact framebuffer the Kraken panel takes"

[dependencies]
herschel-core.workspace = true
thiserror.workspace = true

# Decodes the static image US-017 lets an operator pick. Default features are
# off so the graph carries two decoders rather than the twenty the crate can
# build; MIT OR Apache-2.0, compatible with this project's GPL-3.0-or-later.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Rasterizes the panel's text. Apache-2.0, compatible with this project's
# GPL-3.0-or-later. Chosen over fontdue and swash because it is the smallest
# graph that still gives sub-pixel glyph placement and OpenType kerning:
# owned_ttf_parser to read the outlines and ab_glyph_rasterizer to fill them,
# and nothing else. The coverage callback lands directly on this crate's own
# Canvas::blend, so no intermediate bitmap is allocated per glyph.
ab_glyph = "0.2.32"

[lints]
workspace = true
