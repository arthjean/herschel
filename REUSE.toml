version = 1

# Every Rust source carries its own SPDX header, which is what grants the
# "or later" option per file. This table covers what cannot hold a comment or
# where a header would be noise: manifests, documentation, the status tracker
# and the captured screens.
#
# "closest" rather than "aggregate": a file that already declares its own
# licensing keeps it, and this table only fills the gaps. Aggregating would
# staple a second, identical copyright line onto every Rust source.
#
# The license text is not annotated here. It is the Free Software Foundation's
# work rather than this project's, and REUSE already excludes both LICENSES/
# and a root LICENSE file from the lint, so an annotation for it would be
# configuration that decides nothing. The root copy exists because GitHub's
# detector only looks there while REUSE only reads LICENSES/; the two are
# byte-identical.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Arthur Jean"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The icons are Tabler's, not this project's. They are kept byte-identical to
# upstream rather than given an SPDX header, so the attribution here can be
# checked against the source file it names.
#
# This table comes after the catch-all deliberately: REUSE 3.3 states that "if a
# Covered File is covered by multiple [[annotations]] tables in the same
# REUSE.toml file, then exclusively the last matching table in the file is used",
# so an entry placed above the wildcard would be the one that never applies.
#
# MIT into GPL-3.0-or-later is a compatible direction: the combined work stays
# under the GPL and MIT's notice requirement is met by LICENSES/MIT.txt plus the
# copyright line below.
[[annotations]]
path = "crates/app/assets/icons/**.svg"
precedence = "closest"
SPDX-FileCopyrightText = "2020-2026 Paweł Kuna"
SPDX-License-Identifier = "MIT"

# The panel's typeface is Noto Sans SemiBold 2.015, cut down to 98 glyphs with
# `pyftsubset` so that ten kilobytes ship instead of six hundred. Subsetting
# makes it a Modified Version under OFL 1.1 section 2; the family carries no
# Reserved Font Name (its copyright line is "Copyright 2022 The Noto Project
# Authors" with no RFN clause), so the name is kept and the provenance stays
# checkable. The file is not renamed, remains under OFL 1.1, and section 5's
# condition is met by LICENSES/OFL-1.1.txt beside it.
#
# OFL 1.1 into GPL-3.0-or-later is a compatible direction: the OFL FAQ states an
# OFL font may be bundled with software under any license, including copyleft,
# and the font is aggregated with this program rather than derived from it.
#
# Rebuilt with:
#   pyftsubset NotoSans-SemiBold.ttf \
#     --output-file=crates/lcd-renderer/assets/NotoSans-SemiBold-subset.ttf \
#     --unicodes="U+0020-007E,U+00B0,U+00B7" --layout-features='' \
#     --no-hinting --desubroutinize --drop-tables+=DSIG --name-IDs='*' \
#     --notdef-outline
[[annotations]]
path = "crates/lcd-renderer/assets/*.ttf"
precedence = "closest"
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts/latin-greek-cyrillic)"
SPDX-License-Identifier = "OFL-1.1"

# The caption glyphs are this project's own, drawn on Tabler's 16-pixel grid
# because they sit next to its icons. They are listed after the table above for
# the same reason it is listed after the wildcard: the last matching table wins,
# so this is what takes them back out of the Tabler attribution.
[[annotations]]
path = "crates/app/assets/icons/window/**.svg"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Arthur Jean"
SPDX-License-Identifier = "GPL-3.0-or-later"
